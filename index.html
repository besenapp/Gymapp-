<!doctype html>
<html lang="de">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Gym Assistant</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ffffff">
<style>
:root{--bg:#fff;--muted:#6b7280;--accent:#0f172a}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:var(--bg);color:var(--accent)}
.container{max-width:900px;margin:12px auto;padding:12px}
h1{margin:0;font-size:18px}
.card{background:#f7f8fa;padding:12px;border-radius:10px;margin-top:12px}
button{background:#0f172a;color:white;border:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.secondary{background:transparent;border:1px solid rgba(15,23,42,0.08);color:var(--accent)}
.small{color:var(--muted);font-size:13px}
</style></head><body>
<div class="container">
  <h1>Gym Assistant</h1>
  <div class="card">
    <div style="display:flex;gap:8px">
      <button id="startBtn">Start</button>
      <button id="pauseBtn" class="secondary" disabled>Pause</button>
      <button id="backBtn" class="secondary" disabled>Zurück</button>
      <button id="importVicoach" class="secondary">Vicoach Sync</button>
      <button id="fileBtn" class="secondary">Import Datei / Video</button>
    </div>
    <div style="margin-top:10px" id="ocrLog" class="small">Bereit.</div>
  </div>

  <div class="card">
    <h3>Verlauf</h3>
    <div id="historyList" class="small">Keine Einträge</div>
    <canvas id="chart" width="800" height="120"></canvas>
  </div>

  <div class="card">
    <h3>Analyse</h3>
    <pre id="analysis" class="small">Keine Daten</pre>
  </div>
</div>

<input id="fileInput" type="file" accept="video/*,image/*,.zip,.csv" style="display:none"/>

<!-- libs -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.7.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const fileInput = document.getElementById('fileInput');
const ocrLog = document.getElementById('ocrLog');
const historyList = document.getElementById('historyList');
const analysis = document.getElementById('analysis');
const chartCtx = document.getElementById('chart').getContext('2d');
let logs = JSON.parse(localStorage.getItem('gym_logs')||'[]');

function renderHistory(){ if(!logs.length){ historyList.textContent='Keine Einträge'; return; } historyList.innerHTML=''; logs.slice().reverse().slice(0,10).forEach(l=>{ const d=document.createElement('div'); d.textContent = l.label+' • '+(l.weight||'')+'kg x '+(l.reps||'')+' • '+new Date(l.timestamp).toLocaleString(); historyList.appendChild(d); }); renderChart(); }
function renderChart(){ const labels = logs.slice(-20).map(l=>new Date(l.timestamp).toLocaleDateString()); const data = logs.slice(-20).map(l=>l.weight||0); if(window.myChart) window.myChart.destroy(); window.myChart = new Chart(chartCtx,{type:'line',data:{labels:labels,datasets:[{label:'Gewicht',data:data,borderColor:'#0f172a',fill:false}]},options:{responsive:true,maintainAspectRatio:false}}); }
function saveLogs(){ localStorage.setItem('gym_logs', JSON.stringify(logs)); renderHistory(); }

document.getElementById('fileBtn').onclick = ()=>fileInput.click();
fileInput.onchange = async ()=>{ const f = fileInput.files[0]; if(!f) return; ocrLog.textContent='Verarbeite '+f.name; if(f.type.startsWith('image/')){ const data = await fileToDataUrl(f); await runOCRonImage(data); } else if(f.type.startsWith('video/')){ const frames = await extractFrames(f,1,30); for(let i=0;i<frames.length;i++){ ocrLog.textContent='Frame '+(i+1)+'/'+frames.length; await runOCRonImage(frames[i]); } } else if(f.name.endsWith('.csv')){ const txt = await f.text(); parseCSVImport(txt); } else if(f.name.endsWith('.zip')){ const jszip = new JSZip(); const zip = await jszip.loadAsync(f); const keys = Object.keys(zip.files); for(const k of keys){ if(k.match(/\.(png|jpg|jpeg)$/i)){ const data = await zip.file(k).async('base64'); await runOCRonImage('data:image/png;base64,'+data); } } } ocrLog.textContent='Fertig'; saveLogs(); };

function fileToDataUrl(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(file); }); }

async function extractFrames(file,fps=1,maxF=30){ return new Promise((resolve,reject)=>{ const url = URL.createObjectURL(file); const v = document.createElement('video'); v.src = url; v.preload='auto'; v.muted=true; v.playsInline=true; v.onloadedmetadata = async ()=>{ const dur = Math.min(v.duration, maxF/fps); const canvas = document.createElement('canvas'); canvas.width = v.videoWidth; canvas.height = v.videoHeight; const ctx = canvas.getContext('2d'); const frames=[]; for(let t=0;t<dur;t+=1/fps){ await seek(v,t); ctx.drawImage(v,0,0,canvas.width,canvas.height); frames.push(canvas.toDataURL('image/png')); } URL.revokeObjectURL(url); resolve(frames); }; v.onerror = e=>reject(e); }); }
function seek(video,time){ return new Promise(res=>{ const onSeek = ()=>{ video.removeEventListener('seeked', onSeek); res(); }; video.addEventListener('seeked', onSeek); video.currentTime = Math.min(time, video.duration-0.05); }); }

async function runOCRonImage(dataURL){ const worker = Tesseract.createWorker({logger:m=>{} }); await worker.load(); await worker.loadLanguage('deu'); await worker.initialize('deu'); const { data } = await worker.recognize(dataURL); await worker.terminate(); parseText(data.text); }

function parseText(text){ const lines = text.split('\n').map(s=>s.trim()).filter(Boolean); lines.forEach(l=>{ const m = l.match(/(\d{2,3}(?:[.,]\d)?)\s*kg\s*[x×]\s*(\d{1,2})/i) || l.match(/(\d{2,3})\s*[x]\s*(\d{1,2})/i); if(m){ const weight = parseFloat(m[1].replace(',','.')); const reps = parseInt(m[2]); logs.push({label:'Import',weight,reps,timestamp:new Date().toISOString()}); } }); }

function parseCSVImport(txt){ const rows = txt.split('\n').map(r=>r.split(',')); rows.forEach(r=>{ if(r.length>=3){ const label=r[0]; const weight=parseFloat(r[1])||null; const reps=parseInt(r[2])||null; logs.push({label,weight,reps,timestamp:new Date().toISOString()}); } }); }

// basic analyze
function basicAnalyze(){ if(!logs.length) return analysis.textContent='Keine Daten'; const by = {}; logs.forEach(l=>{ const key = l.label.toLowerCase(); by[key]=by[key]||{w:0,r:0,c:0}; by[key].w += (l.weight||0); by[key].r += (l.reps||0); by[key].c++; }); let out=''; for(const k in by){ out += k+': Ø'+(by[k].w/by[k].c).toFixed(1)+'kg × Ø'+(by[k].r/by[k].c).toFixed(1)+' reps\n'; } analysis.textContent = out; }

document.getElementById('importVicoach').onclick = ()=>{ alert('Wähle CSV/JSON Export aus Vicoach und lade ihn hoch.'); fileInput.click(); };
document.getElementById('startBtn').onclick = ()=>{ startBtn.disabled=true; pauseBtn.disabled=false; };
document.getElementById('pauseBtn').onclick = ()=>{ pauseBtn.textContent = pauseBtn.textContent==='Pause'?'Weiter':'Pause'; };

renderHistory(); basicAnalyze();
</script>
</body></html>
